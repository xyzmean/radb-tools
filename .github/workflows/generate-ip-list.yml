name: Generate RU+CN IP List

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build local pyasn DB
        run: bash renew-db

      - name: Fetch RU prefixes (RIPE API)
        run: python3 ip-country-ripe.py RU

      - name: Fetch CN prefixes (RIPE API)
        run: python3 ip-country-ripe.py CN

      - name: Fetch extra sources (remote + local DB + country scripts)
        run: python3 fetch-extra-sources.py > extra.lst

      - name: Combine and aggregate all sources
        run: |
          python3 - <<'EOF'
          import ipaddress
          from aggregate_prefixes import aggregate_prefixes

          lines = (
              open("ip_RU.lst").read().split()
              + open("ip_CN.lst").read().split()
              + open("extra.lst").read().split()
          )
          result = sorted(
              aggregate_prefixes(lines),
              key=lambda x: ipaddress.ip_network(x),
          )
          with open("combined.lst", "w") as f:
              f.write("\n".join(str(n) for n in result) + "\n")
          print(f"Combined: {len(result)} prefixes")
          EOF

      - name: Append disallow.lst entries
        run: python3 filter-disallow.py combined.lst disallow.lst > ru_cn_final.lst

      - name: Build rucn.dat (v2ray geoip format)
        run: python3 build-geoip.py ru_cn_final.lst rucn.dat rucn

      - name: Show stats
        run: |
          echo "Final prefix count: $(wc -l < ru_cn_final.lst)"
          echo "rucn.dat size: $(wc -c < rucn.dat) bytes"

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push -f origin latest
          gh release create latest ru_cn_final.lst rucn.dat \
            --title "RU+CN IP List ${DATE}" \
            --notes "Auto-generated daily. Sources: RIPE API, local pyasn DB, ip-country.py, asn-country.py, cidrwhitelist, geoip.dat, geosite.dat, disallow.lst." \
            --latest
