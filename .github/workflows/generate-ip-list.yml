name: Generate RU+CN IP List

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build local pyasn DB (BGP RIB snapshot)
        run: bash renew-db

      - name: Fetch RU prefixes (RIPE API)
        run: python3 ip-country-ripe.py RU

      - name: Fetch CN prefixes (RIPE API)
        run: python3 ip-country-ripe.py CN

      - name: Fetch extra sources (whitelist + geoip.dat + geosite.dat + local DB)
        run: python3 fetch-extra-sources.py > extra.lst

      - name: Combine and aggregate all sources
        run: python3 combine-lists.py combined.lst ip_RU.lst ip_CN.lst extra.lst

      - name: Append extra-include.lst entries
        run: python3 filter-disallow.py combined.lst extra-include.lst > ru_cn_final.lst

      - name: Build rucn.dat (v2ray geoip format)
        run: python3 build-geoip.py ru_cn_final.lst rucn.dat rucn

      - name: Show stats
        run: |
          echo "Final prefix count: $(wc -l < ru_cn_final.lst)"
          echo "rucn.dat size: $(wc -c < rucn.dat) bytes"

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push -f origin latest
          gh release create latest ru_cn_final.lst rucn.dat \
            --title "RU+CN IP List ${DATE}" \
            --notes "Auto-generated daily. Sources: RIPE API, local pyasn DB (BGP RIB), cidrwhitelist, geoip.dat, geosite.dat, extra-include.lst." \
            --latest
